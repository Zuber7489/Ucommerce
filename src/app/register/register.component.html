<div class="container h-100 mt-5">
	<div class="row justify-content-center align-items-center h-100">
	  <div class="col-md-6 col-lg-4">
		<div class="card shadow-lg border-0">
		  <div class="card-header bg-primary text-white text-center">
			<h3 class="mb-0 text-white">Register</h3>
		  </div>
		  <div class="card-body p-4">
			<form [formGroup]="signupForm" (ngSubmit)="signup()">
			  <div class="mb-3">
				<div class="input-group">
				  <span class="input-group-text bg-primary text-white"><i class="fas fa-user"></i></span>
				  <input type="email" class="form-control" formControlName="email" placeholder="Email">
				</div>
				<div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="text-danger mt-1">
				  <small *ngIf="signupForm.get('email')?.errors?.['required']">Email is required.</small>
				  <small *ngIf="signupForm.get('email')?.errors?.['email']">Please enter a valid email address.</small>
				</div>
			  </div>
			  <div class="mb-3">
				<div class="input-group">
				  <span class="input-group-text bg-primary text-white"><i class="fas fa-key"></i></span>
				  <input type="password" class="form-control" formControlName="password" placeholder="Password">
				</div>
				<div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="text-danger mt-1">
				  <small *ngIf="signupForm.get('password')?.errors?.['required']">Password is required.</small>
				  <small *ngIf="signupForm.get('password')?.errors?.['minlength']">
					Password must be at least 6 characters.
				  </small>
				</div>
			  </div>
			  <div class="d-grid">
				<button type="submit" class="btn btn-primary btn-block" [disabled]="signupForm.invalid">Signup</button>
			  </div>
			</form>
		  </div>
		  <div class="card-footer text-center">
			<a (click)="signupredirect()" class="text-primary">Already have an account? Login</a>
		  </div>
		</div>
	  </div>
	</div>
  </div>
